[project]
name = "engivault-processor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.15.0,<3",
  "httpx>=0.28,<1",
  "pypdf>=6.16.1,<7",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "httpx>=0.28,<1", "ruff>=0.12,<1", "mypy>=1.17,<2", "types-openpyxl>=3.1,<4"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
