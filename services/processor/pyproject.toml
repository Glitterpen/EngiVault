[project]
name = "engivault-processor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "pydantic-settings>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "httpx>=0.28,<1", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
