project_id = "engivault-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/callback"]
enable_signup = true

[auth.email.template.confirmation]
subject = "{{ if .Data.inviting_organisation_name }}{{ .Data.inviting_organisation_name }}: verify your project account{{ else }}Confirm your EngiCite organisation account{{ end }}"
content_path = "./supabase/templates/confirmation.html"

[storage]
enabled = true
file_size_limit = "250MiB"
